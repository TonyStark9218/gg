<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard - Access Denied</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            animation: fadeIn 0.5s ease-out;
            margin: 20px;
        }

        .icon {
            font-size: 64px;
            color: #4285F4;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #5f6368;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4285F4;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
            margin: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #3267d6;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        input[type="file"] {
            margin-bottom: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
                max-width: 90%;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            .icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛑</div>
        <h1>Access Denied</h1>
        <p id="blockedMsg">This site has been blocked by WebGuard. Contact your administrator or check your blocklist settings via Telegram to unblock it.</p>

        <!-- File Upload Section -->
        <form id="zipForm">
            <input type="file" id="zipFile" accept=".zip" />
            <br>
            <button type="submit" class="btn">Download Selected Zip</button>
        </form>

        <a href="https://www.google.com" class="btn">Go to Google</a>
    </div>

    <script>
        // Show blocked site message if URL param exists
        const urlParams = new URLSearchParams(window.location.search);
        const blockedUrl = urlParams.get('url');
        if (blockedUrl) {
            document.getElementById('blockedMsg').innerText = `The site "${blockedUrl}" has been blocked by WebGuard. Contact your administrator or check your blocklist settings via Telegram to unblock it.`;
        }

        // Handle zip file download
        document.getElementById('zipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('zipFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a ZIP file first.');
                return;
            }

            const url = URL.createObjectURL(file);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
